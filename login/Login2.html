<!DOCTYPE HTML>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes! - Login</title>
    
    <link rel="stylesheet" href="login2.css">
    
  </head>

  <body>

      
      <h1>Bem-Vindo!</h1>

      <form action="index.html">
        
        <div class="campo">
        <label for="email">E-mail:</label>
        <input class="login" type="email" id="email" placeholder="Digite seu email" required>
        </div>
        
        <div class="campo">
        <label for="password">Senha:</label>
        <input class="login" type="password" id="password" placeholder="Digite sua senha" required>
        <a class="redefinir" href="#">Esqueceu a senha?</a>
        </div>

        
        <button class="button" type="submit">Login</button>
        
      </form>

    
  </body>
  
</html>
